<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisab Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Mukta:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="calc" aria-label="Calculator">
    <header class="brand">
      <span class="logo" lang="ne">हिसाब</span>
      <span class="model">HB-13 · Kathmandu</span>
      <span class="solar" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </header>

    <div class="lcd" id="lcd" title="Click to copy the result">
      <span class="toast" id="toast">Copied</span>
      <div class="lcd-expr" id="expr">&nbsp;</div>
      <div class="lcd-result" id="result" aria-live="polite">0</div>
      <div class="lcd-words" id="words">zero</div>
    </div>

    <div class="modes">
      <div class="seg" role="group" aria-label="Digits">
        <button type="button" id="digLatin" aria-pressed="true">123</button>
        <button type="button" id="digDeva" aria-pressed="false" lang="ne">१२३</button>
      </div>
      <div class="seg" role="group" aria-label="Number grouping">
        <button type="button" id="grpLakh" aria-pressed="true">Lakh</button>
        <button type="button" id="grpIntl" aria-pressed="false">Million</button>
      </div>
    </div>

    <div class="keys" id="keys">
      <button type="button" class="key fn" data-k="AC" aria-label="All clear">AC</button>
      <button type="button" class="key fn" data-k="back" aria-label="Backspace">⌫</button>
      <button type="button" class="key fn" data-k="(">(</button>
      <button type="button" class="key fn" data-k=")">)</button>

      <button type="button" class="key" data-k="7">7</button>
      <button type="button" class="key" data-k="8">8</button>
      <button type="button" class="key" data-k="9">9</button>
      <button type="button" class="key op" data-k="÷" aria-label="Divide">÷</button>

      <button type="button" class="key" data-k="4">4</button>
      <button type="button" class="key" data-k="5">5</button>
      <button type="button" class="key" data-k="6">6</button>
      <button type="button" class="key op" data-k="×" aria-label="Multiply">×</button>

      <button type="button" class="key" data-k="1">1</button>
      <button type="button" class="key" data-k="2">2</button>
      <button type="button" class="key" data-k="3">3</button>
      <button type="button" class="key op" data-k="−" aria-label="Minus">−</button>

      <button type="button" class="key fn" data-k="±" aria-label="Change sign">±</button>
      <button type="button" class="key" data-k="0">0</button>
      <button type="button" class="key" data-k=".">.</button>
      <button type="button" class="key op" data-k="+" aria-label="Plus">+</button>

      <button type="button" class="key fn" data-k="%" aria-label="Percent">%</button>
      <button type="button" class="key fn vat" data-k="vat" aria-label="Add 13 percent VAT">+VAT<small>13%</small></button>
      <button type="button" class="key eq" data-k="=" aria-label="Equals">=</button>
    </div>
  </section>

  <section class="tape" aria-label="Paper tape">
    <div class="tape-head">
      <h1 class="tape-title"><span>Paper tape</span><span lang="ne" class="ne">हिसाब-किताब</span></h1>
      <button type="button" class="clear" id="clear">Clear tape</button>
    </div>
    <ol class="rows" id="rows"></ol>
    <p class="empty" id="empty" hidden>Every answer you get prints here. Tap a line to reuse its total.</p>
    <p class="hint">Tap a line to reuse its total. Keyboard works too: <kbd>0–9</kbd> <kbd>+ − * /</kbd> <kbd>( ) %</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd></p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
